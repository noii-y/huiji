[package]
name = "qingjian-cli"
description = "命令行测试工具：看候选、逐键计时、回放输入日志评测、整句评测"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# 端侧整句翻译：编译 ct2rs/CTranslate2，离线翻译、数据不出本机
local-nmt = ["qingjian-predict/local-nmt"]
# 满血 oneMKL（暂不可用，保留备查）
local-nmt-mkl = ["qingjian-predict/local-nmt-mkl"]
# 满血预编译 SDK（内含 oneDNN，推荐）
local-nmt-system = ["qingjian-predict/local-nmt-system"]

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
dotenvy.workspace = true
qingjian-core.workspace = true
qingjian-dictionary.workspace = true
qingjian-learning.workspace = true
qingjian-platform.workspace = true
qingjian-predict.workspace = true
qingjian-lm.workspace = true
qingjian-neural.workspace = true
qingjian-translate.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
